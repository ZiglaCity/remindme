name: Deploy Azure worker

# Reuses the OIDC identity configured by Azure Deployment Center.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run worker:build
      - run: npm ci --omit=dev --prefix dist/notification-scheduler
      - name: Exclude build inspection manifest
        run: node --input-type=module -e "import { unlinkSync } from 'node:fs'; unlinkSync('dist/notification-scheduler/bundle-manifest.json');"
      - name: Sign in using the configured GitHub identity
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_03EF9E4BF9ED4634B5AEBB06AAAFC244 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_66944F0F6C3E48D6B3749F051FAAEB1D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3E6AA50A00854353AE1CA2B6A51294FE }}
      - name: Deploy the standalone package
        uses: Azure/functions-action@v1
        with:
          app-name: remindme
          package: dist/notification-scheduler
          remote-build: false
